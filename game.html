<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin:0; background:#111; overflow:hidden; }
  canvas { display:block; background:#222; margin:0 auto; }
  #score { position:absolute; top:10px; left:10px; color:white; font-family:sans-serif; font-size:20px; }
</style>
</head>
<body>
<div id="score">خاڵ: 0</div>
<canvas id="game" width="360" height="600"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let player = { x: 160, y: 550, w: 40, h: 40 };
let obstacles = [];
let score = 0;
let gameOver = false;

function spawnObstacle() {
  obstacles.push({ x: Math.random() * (canvas.width - 30), y: -30, w: 30, h: 30, speed: 3 + Math.random() * 3 });
}

canvas.addEventListener("touchmove", (e) => {
  let touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
  player.x = touchX - player.w / 2;
});

function update() {
  if (gameOver) return;
  score++;
  document.getElementById("score").innerText = "خاڵ: " + score;

  if (Math.random() < 0.03) spawnObstacle();

  obstacles.forEach(o => o.y += o.speed);
  obstacles = obstacles.filter(o => o.y < canvas.height);

  obstacles.forEach(o => {
    if (player.x < o.x + o.w && player.x + player.w > o.x &&
        player.y < o.y + o.h && player.y + player.h > o.y) {
      gameOver = true;
    }
  });
}
